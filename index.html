<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TaskFlow · TypeTasks</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="wrap">
      <h1>TaskFlow</h1>

      <form class="addrow" id="add-form">
        <input id="title" placeholder="What needs doing?" autocomplete="off" />
        <button id="add" type="submit">Add</button>
      </form>

      <div id="chips" class="chips"></div>
      <ul id="list" class="list"></ul>
      <p id="empty" class="empty" hidden>Nothing here yet.</p>
    </main>

    <!-- load the COMPILED js, as a module so it can import model.js -->
    <script type="module" src="app.js"></script>
  </body>
</html>
